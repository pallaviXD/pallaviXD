<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 490" width="380" height="490">
  <defs>
    <linearGradient id="aviBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <style>
    .terminal-bg {
      fill: url(#aviBgGrad);
      stroke: #30363d;
      stroke-width: 1;
      rx: 8px;
    }
    .term-prompt {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 11.5px;
      font-weight: 600;
    }
    
    /* Typewriter row-by-row wipe animation (runs once, freezes) */
    @keyframes typeWipe {
      0% {
        opacity: 0;
        transform: translateY(2px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ascii-row {
      font-family: "Fira Code", "SFMono-Regular", Consolas, "Courier New", monospace;
      font-size: 8.5px;
      letter-spacing: 1.4px;
      fill: #c9d1d9;
      opacity: 0;
      animation: typeWipe 0.08s ease-out forwards;
      will-change: opacity, transform;
    }
  </style>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" width="379" height="489" rx="8" class="terminal-bg" />

  <!-- Terminal Window Top Bar -->
  <path d="M 0.5 8 A 7.5 7.5 0 0 1 8 0.5 L 372 0.5 A 7.5 7.5 0 0 1 379.5 8 L 379.5 32 L 0.5 32 Z" fill="#161b22" stroke="#30363d" stroke-width="1" />

  <!-- Window Control Buttons -->
  <circle cx="18" cy="16" r="5" fill="#ff5f56" />
  <circle cx="34" cy="16" r="5" fill="#ffbd2e" />
  <circle cx="50" cy="16" r="5" fill="#27c93f" />

  <!-- Terminal Prompt Command -->
  <text x="72" y="20" class="term-prompt">
    <tspan fill="#39d353">pallavi@DESKTOP</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3">$ cat avatar.txt</tspan>
  </text>

  <!-- ASCII Lines -->
