<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 246" width="880" height="246">
  <defs>
    <linearGradient id="icBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes slideFade {
      0%   { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .info-line {
      font-family: "Fira Code", "SFMono-Regular", Consolas, "Courier New", monospace;
      font-size: 12px;
      animation: slideFade 0.35s cubic-bezier(0.16,1,0.3,1) both;
    }
    .term-prompt {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 11.5px;
      font-weight: 600;
    }
    @media (prefers-reduced-motion: reduce) {
      .info-line {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  </style>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="879" height="245" rx="8" fill="url(#icBg)" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M 0.5 8 A 7.5 7.5 0 0 1 8 0.5 L 872 0.5 A 7.5 7.5 0 0 1 879.5 8 L 879.5 32 L 0.5 32 Z"
        fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="18" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="16" r="5" fill="#27c93f"/>
  <text x="70" y="20.5" class="term-prompt">
    <tspan fill="#3fb950">pallavi@DESKTOP</tspan><tspan fill="#484f58">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3">$ neofetch --profile</tspan>
  </text>
  <line x1="0" y1="32" x2="880" y2="32" stroke="#21262d" stroke-width="1"/>

  <!-- User identity header -->
  <text x="24" y="56" font-family="'Fira Code',monospace" font-size="14px" font-weight="bold"
        style="animation-delay:0ms;" class="info-line">
    <tspan fill="#58a6ff">pallavi</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#3fb950">DESKTOP</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0ms" fill="freeze"/>
  </text>

  <!-- Field lines -->
  <text x="24" y="80" class="info-line" style="animation-delay:150ms;"><tspan fill="#e3b341" font-weight="bold">identity     </tspan><tspan fill="#484f58">: </tspan><tspan fill="#e6edf3">final-year ISE student, backend engineer aiming toward ai/llm systems</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="150ms" fill="freeze"/></text>
  <text x="24" y="102" class="info-line" style="animation-delay:300ms;"><tspan fill="#e3b341" font-weight="bold">location     </tspan><tspan fill="#484f58">: </tspan><tspan fill="#8b949e">bengaluru, india</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="300ms" fill="freeze"/></text>
  <text x="24" y="124" class="info-line" style="animation-delay:450ms;"><tspan fill="#e3b341" font-weight="bold">stack        </tspan><tspan fill="#484f58">: </tspan><tspan fill="#e6edf3">react, next.js, node.js, fastapi, typescript, docker, rag/faiss, groq, gemini</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="450ms" fill="freeze"/></text>
  <text x="24" y="146" class="info-line" style="animation-delay:600ms;"><tspan fill="#e3b341" font-weight="bold">highlights   </tspan><tspan fill="#484f58">: </tspan><tspan fill="#e6edf3">sih 2026 grand finalist, top 50 of 3500+ teams (sentra, upi fraud prevention)</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="600ms" fill="freeze"/></text>
  <text x="24" y="168" class="info-line" style="animation-delay:750ms;"><tspan fill="#8b949e">               </tspan><tspan fill="#8b949e">two hackathon podium finishes: unifytalk, accessibility app for deaf, mute, and blind users</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="750ms" fill="freeze"/></text>
  <text x="24" y="190" class="info-line" style="animation-delay:900ms;"><tspan fill="#e3b341" font-weight="bold">open-source  </tspan><tspan fill="#484f58">: </tspan><tspan fill="#8b949e">gssoc project admin: nutrimind-ai, reposcout</tspan><animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="900ms" fill="freeze"/></text>

  <!-- Palette group -->
  <g style="animation-delay:1050ms;" class="info-line">
    <text x="24" y="220" fill="#8b949e" font-size="9px" font-family="'Fira Code',monospace">SYSTEM PALETTE</text>
    <rect x="24" y="226" width="18" height="10" rx="2" fill="#21262d"/><rect x="48" y="226" width="18" height="10" rx="2" fill="#ff7b72"/><rect x="72" y="226" width="18" height="10" rx="2" fill="#3fb950"/><rect x="96" y="226" width="18" height="10" rx="2" fill="#d29922"/><rect x="120" y="226" width="18" height="10" rx="2" fill="#58a6ff"/><rect x="144" y="226" width="18" height="10" rx="2" fill="#bc8cff"/><rect x="168" y="226" width="18" height="10" rx="2" fill="#39c5cf"/><rect x="192" y="226" width="18" height="10" rx="2" fill="#f0f6fc"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="1050ms" fill="freeze"/>
  </g>
</svg>