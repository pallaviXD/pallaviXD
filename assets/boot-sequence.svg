<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <linearGradient id="bsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <style>
    /* Print once and freeze */
    @keyframes bootAppear {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .boot-line {
      font-family: "Fira Code", "SFMono-Regular", Consolas, "Courier New", monospace;
      font-size: 13px;
      animation: bootAppear 0.08s ease both;
    }

    /* Blinking cursor blinks after it appears */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s step-end infinite;
      animation-delay: 2860ms;
    }
    .term-prompt {
      font-family: "Fira Code", "Courier New", monospace;
      font-size: 11.5px;
      font-weight: 600;
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-line, .cursor {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  </style>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="879" height="239" rx="8" fill="url(#bsBg)" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M 0.5 8 A 7.5 7.5 0 0 1 8 0.5 L 872 0.5 A 7.5 7.5 0 0 1 879.5 8 L 879.5 32 L 0.5 32 Z"
        fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Window control dots -->
  <circle cx="18" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="16" r="5" fill="#27c93f"/>

  <!-- Prompt in title bar -->
  <text x="70" y="20.5" class="term-prompt">
    <tspan fill="#3fb950">pallavi@DESKTOP</tspan><tspan fill="#484f58">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#e6edf3">$ ./initialize_pallaviXD.sh</tspan>
  </text>

  <!-- Divider line -->
  <line x1="0" y1="32" x2="880" y2="32" stroke="#21262d" stroke-width="1"/>

  <text x="28" y="58" class="boot-line" style="animation-delay:0ms;"><tspan fill="#3fb950" font-weight="bold">[ OK ]</tspan> <tspan fill="#e6edf3">loading module: backend-engineering</tspan><animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="0ms" fill="freeze"/></text>
  <text x="28" y="80" class="boot-line" style="animation-delay:380ms;"><tspan fill="#3fb950" font-weight="bold">[ OK ]</tspan> <tspan fill="#e6edf3">loading module: rag-pipelines</tspan><animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="380ms" fill="freeze"/></text>
  <text x="28" y="102" class="boot-line" style="animation-delay:760ms;"><tspan fill="#3fb950" font-weight="bold">[ OK ]</tspan> <tspan fill="#e6edf3">loading module: llm-systems</tspan><animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="760ms" fill="freeze"/></text>
  <text x="28" y="124" class="boot-line" style="animation-delay:1140ms;"><tspan fill="#e3b341" font-weight="bold">[....]</tspan> <tspan fill="#e6edf3">compiling ambition: ai/llm engineer : 73%</tspan><animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1140ms" fill="freeze"/></text>
  <text x="28" y="146" class="boot-line" style="animation-delay:1520ms;"><tspan fill="#3fb950" font-weight="bold">[ OK ]</tspan> <tspan fill="#e6edf3">hackathons indexed: 3 podium finishes</tspan><animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1520ms" fill="freeze"/></text>
  <text x="28" y="168" class="boot-line" style="animation-delay:1900ms;"><tspan fill="#3fb950" font-weight="bold">[ OK ]</tspan> <tspan fill="#e6edf3">open-source: gssoc project admin</tspan><animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="1900ms" fill="freeze"/></text>
  <text x="28" y="190" class="boot-line" style="animation-delay:2280ms;"><tspan fill="#3fb950" font-weight="bold">[ OK ]</tspan> <tspan fill="#e6edf3">status: still building</tspan><animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="2280ms" fill="freeze"/></text>
  <text x="28" y="212" class="boot-line" style="animation-delay:2660ms;"><tspan fill="#3fb950" font-weight="bold">[done]</tspan> <tspan fill="#8b949e">pallavi@DESKTOP:~$</tspan> <tspan fill="#58a6ff" class="cursor">|</tspan><animate attributeName="opacity" from="0" to="1" dur="0.08s" begin="2660ms" fill="freeze"/></text>
</svg>